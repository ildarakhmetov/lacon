[package]
name = "lacon"
version = "0.1.0"
edition = "2021"

[dependencies]
# Audio Capture
cpal = "0.15"
hound = "3.5"

# Whisper Transcription (remove "cuda" feature if no NVIDIA GPU)
whisper-rs = { version = "0.13", features = [] }

# Ollama HTTP Client
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hotkeys & Keyboard Simulation
rdev = "0.5"
enigo = "0.2"

# Async Runtime
tokio = { version = "1", features = ["full"] }
